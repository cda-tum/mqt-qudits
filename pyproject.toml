[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "mqt-core~=3.10.0",
  "nanobind~=3.0.1",
  "scikit-build-core>=1.0.3",
  "vcs-versioning>=2.3",
]


[project]
name = "mqt-qudits"
description = "A Framework For Mixed-Dimensional Qudit Quantum Computing"
readme = "README.md"
keywords = [ "design-automation", "MQT", "quantum-computing", "qudits" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11,!=3.14.1"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "h5py>=3.8",
  "h5py>=3.12.1; python_version>='3.12'",
  "h5py>=3.15; python_version>='3.14'",
  "matplotlib>=3.7",
  "matplotlib>=3.8; python_version>='3.12'",
  "matplotlib>=3.10.5; python_version>='3.14'",
  "matplotlib>=3.10; python_version>='3.13'",
  "nanobind-backend>=1",
  "networkx>=3",
  "numpy>=1.24",
  "numpy>=1.26; python_version>='3.12'",
  "numpy>=2.1; python_version>='3.13'",
  "numpy>=2.3.2; python_version>='3.14'",
  "scipy>=1.10",
  "scipy>=1.12; python_version>='3.12'",
  "scipy>=1.15; python_version>='3.13'",
  "scipy>=1.16.1; python_version>='3.14'",
  "tensornetwork>=0.4",
  "typing-extensions>=4.16",
]

[[project.authors]]
name = "Kevin Mato"
email = "kevin.mato@tum.de"

[[project.authors]]
name = "Lukas Burgholzer"
email = "lukas.burgholzer@tum.de"

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/qudits"
Documentation = "https://mqt.readthedocs.io/projects/qudits"
Issues = "https://github.com/munich-quantum-toolkit/qudits/issues"
Discussions = "https://github.com/munich-quantum-toolkit/qudits/discussions"


[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  "nox>=2025.11.12",
]
test = [
  "matplotlib>=3.7",
  "networkx>=3",
  "numpy>=1.24",
  "pytest>=9.0.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
  "scipy>=1.10",
  "tensornetwork>=0.4",
  "typing-extensions>=4.16",
]
docs = [
  "furo>=2025.12.19",
  "ipykernel>=6.29.5",
  "myst-nb>=1.4",
  "sphinx>=9",
  "sphinx-autoapi>=3.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-inline-tabs>=2023.4.21",
  "sphinx-llm>=1",
  "sphinxcontrib-bibtex>=2.7",
  "sphinxext-opengraph>=0.13",
]
build = [
  "cmake>=4.4.1",
  "mqt-core~=3.10.0",
  "nanobind~=3.0.1",
  "scikit-build-core>=1.0.3",
  "vcs-versioning>=2.3",
]


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}/{build_type}"

[tool.scikit-build.build]

# Only build the Python bindings target
targets = [ "mqt-qudits-bindings" ]

[tool.scikit-build.cmake]

# CMake 4.4 detects free-threaded Python and supplies Py_GIL_DISABLED on Windows
version = ">=4.4.1"

[tool.scikit-build.cmake.define]
BUILD_MQT_QUDITS_TESTS = "OFF"
BUILD_MQT_QUDITS_BINDINGS = "ON"

[tool.scikit-build.ninja]

# Set required Ninja version
version = ">=1.10"

[tool.scikit-build.sdist]
include = [ "python/mqt/qudits/_version.py" ]
exclude = [
  "**/.github",
  "**/doc",
  "**/docs",
  "**/meta",
  "**/plots",
  "**/test",
  "**/tests",
]

[tool.scikit-build.wheel]

# Set the wheel install directory
install-dir = "mqt/qudits"

# Build one split-mode Stable ABI wheel for GIL-enabled CPython 3.11+
py-api = "cp311"

# Explicitly set the package directory
packages = [ "python/mqt" ]

[tool.scikit-build.install]

# Only install the Python package component
components = [ "mqt-qudits_Python" ]

[[tool.scikit-build.overrides]]
if.python-version = ">=3.15"
if.abi-flags = "t"
wheel.py-api = "cp315t"


[tool.uv]
required-version = ">=0.5.20"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "bindings/**/*.cpp" },
]

[tool.uv.sources]
mqt-qudits = { workspace = true }


[tool.cibuildwheel]
build = "cp3*"
skip = [ "*-musllinux_*", "cp314t-*" ]
archs = "auto64"
build-frontend = "uv"
test-command = "pytest {project}/test/python"
test-groups = [ "test" ]

[tool.cibuildwheel.linux]
environment = { DEPLOY = "ON" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -v -w {dest_dir} {wheel} --namespace-pkg mqt"
before-test = "uv pip install --group test"
# cibuildwheel 4.2 passes expanded dependency groups through cmd.exe, which interprets version
# operators as redirections. Let uv resolve the group itself.
test-groups = []

[[tool.cibuildwheel.overrides]]
select = [ "cp*-win_arm64", "cp315*" ]
test-command = ""


[tool.ruff]
line-length = 120
namespace-packages = [ "mqt" ]
src = [ "python" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"test/python/**" = [ "ANN", "T20" ]
"python/mqt/qudits/visualisation/**" = [ "T20" ]
"docs/**" = [ "T20" ]
"noxfile.py" = [ "T20", "TID251" ]
"*.pyi" = [ "D301", "D418", "E501", "PYI021" ]
"*.ipynb" = [
  "D",    # pydocstyle
  "E402", # Allow imports to appear anywhere in Jupyter notebooks
  "I002", # Allow missing `from __future__ import annotations` import
]

[tool.ruff.lint.isort]
known-first-party = [ "mqt.qudits" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
extend-select = [
  "A",      # flake8-builtins
  "ANN",    # flake8-annotations
  "ARG",    # flake8-unused-arguments
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FA",     # flake8-future-annotations
  "FLY",    # flynt
  "FURB",   # refurb
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging-format
  "N",      # flake8-naming
  "NPY",    # numpy
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TID251", # flake8-tidy-imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
]
ignore = [
  "D10",     # Missing docstrings
  "PLC0415", # Import should be at top of file
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
]
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.check-sdist]
sdist-only = [ "python/mqt/qudits/_version.py" ]
git-only = [
  "docs/*",
  "extern/*",
  "test/*",
]


[tool.check-wheel-contents]
ignore = [ "W002" ]  # Triggers on __init__.py's


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on" # ignore block
]

[tool.typos.default.extend-words]
wille = "wille"
anc = "anc"
mone = "mone"


[tool.ty.src]
exclude = [
  "docs/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--showlocals",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "test/python" ]


[tool.coverage]

[tool.coverage.run]
source = [ "mqt.qudits" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  '\.\.\.',
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]


[[tool.dynamic-metadata]]
provider = "vcs_versioning"


[tool.vcs-versioning]
write_to = "python/mqt/qudits/_version.py"
